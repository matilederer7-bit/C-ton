services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: siton_ci
      POSTGRES_PASSWORD: siton_ci_password
      POSTGRES_DB: siton_ci
    ports:
      - target: 5432
        host_ip: 127.0.0.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siton_ci -d siton_ci"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: siton-ci-root
      MINIO_ROOT_PASSWORD: siton-ci-root-secret
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - object_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    volumes:
      - ./scripts/minio-readonly-policy.json:/policies/readonly.json:ro
      - ./scripts/minio-writeonly-policy.json:/policies/writeonly.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set ci http://minio:9000 siton-ci-root siton-ci-root-secret; do sleep 1; done &&
        mc mb --ignore-existing ci/siton-ci-private &&
        mc anonymous set none ci/siton-ci-private &&
        mc admin policy create ci siton-ci-readonly /policies/readonly.json &&
        mc admin policy create ci siton-ci-writeonly /policies/writeonly.json &&
        mc admin user add ci siton-ci-reader siton-ci-reader-secret &&
        mc admin user add ci siton-ci-writer siton-ci-writer-secret &&
        mc admin policy attach ci siton-ci-readonly --user siton-ci-reader &&
        mc admin policy attach ci siton-ci-writeonly --user siton-ci-writer
  migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment: &ci-env
      APP_DEPLOYMENT_MODE: demo-preview
      NODE_ENV: test
      DATABASE_URL: postgresql://siton_ci:siton_ci_password@postgres:5432/siton_ci
      DB_SCHEMA: siton
      PAYMENT_PROVIDER: mockpay
      PAYMENT_PROVIDER_MODE: mock-backed
      PAYMENT_WEBHOOK_SECRET: ci-placeholder-only
      ADMIN_API_KEY: ci-placeholder-only
      DISABLE_OUTBOX_WORKER: "1"
      STORAGE_ADAPTER: object
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_BUCKET: siton-ci-private
      OBJECT_STORAGE_ACCESS_KEY_ID: siton-ci-root
      OBJECT_STORAGE_SECRET_ACCESS_KEY: siton-ci-root-secret
      OBJECT_STORAGE_FORCE_PATH_STYLE: "1"
      OBJECT_STORAGE_TIMEOUT_MS: "5000"
      OBJECT_STORAGE_PREFIX: ci
      OBJECT_STORAGE_SIGNED_URL_TTL_SECONDS: "2"
      RATE_LIMIT_MAX: "100000"
      RATE_LIMIT_SENSITIVE_MAX: "100000"
    command: ["sh", "-c", "npm run db:migrate && node scripts/seed_test_prerequisites.cjs"]

  web:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *ci-env
      RUNTIME_ROLE: web
      HOST: 0.0.0.0
      PORT: "3000"
    command: ["npm", "run", "start:web:prod"]
    ports:
      - target: 3000
        host_ip: 127.0.0.1
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  web-secondary:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *ci-env
      RUNTIME_ROLE: web
      HOST: 0.0.0.0
      PORT: "3000"
    command: ["npm", "run", "start:web:prod"]
    ports:
      - target: 3000
        host_ip: 127.0.0.1
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
  worker:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *ci-env
      RUNTIME_ROLE: worker
      WORKER_ID: ci-worker
      OUTBOX_POLL_MS: "100"
      WORKER_HEARTBEAT_MS: "500"
      WORKER_CONCURRENCY: "2"
    command: ["npm", "run", "start:worker:prod"]
    healthcheck:
      test: ["CMD", "node", "-e", "const{Client}=require('pg');const c=new Client({connectionString:process.env.DATABASE_URL});c.connect().then(()=>c.query(\"select 1 from siton.worker_heartbeats where worker_id='ci-worker' and status='ready' and heartbeat_at>now()-interval '10 seconds'\")).then(r=>c.end().then(()=>process.exit(r.rowCount===1?0:1))).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 4s
      retries: 30

volumes:
  object_data:

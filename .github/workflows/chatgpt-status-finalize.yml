name: ChatGPT integration status finalize

on:
  push:
    branches:
      - chatgpt/status-runner-f620072

permissions:
  contents: write

jobs:
  finalize-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepend integration milestone and push target
        shell: bash
        run: |
          set -euo pipefail
          TARGET='chatgpt/integrate-pr18-product-path-f620072'
          git config user.name 'ChatGPT Integration'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin "$TARGET"
          git checkout -B "$TARGET" "origin/$TARGET"
          MARKER='PR #18 + PRODUCT-PATH CLOSEOUT — INTEGRATED CANDIDATE'
          if ! grep -Fq "$MARKER" PROJECT_STATUS.md; then
            cat > /tmp/status-block.md <<'EOF'
          ## PR #18 + PRODUCT-PATH CLOSEOUT — INTEGRATED CANDIDATE (2026-09-16)

          - **COMPLETED:** The adversarial production-hardening line from PR #18 and the independently prepared seller-to-buyer product-path closeout were transferred, cryptographically checked, and combined on `chatgpt/integrate-pr18-product-path-f620072`. The product-path package was applied from exact base `f2121f60cc37d742e2bf32d0ca48fe2ec83a807d`; its final Git tree is `73c8f83821c3112fc74da9d9117317dbf57b497a`, matching the supplied bundle. Integration merge commit `51d26e126d8a5324daef6d28f720fc09552b3e9c` has parents PR #18 head `1402abebf646658c0013bf5124a825fc3dc516ec` and transferred product-path head `6c90c11f5b5d55c8e5daddc137e1aa70e7a4da06`. The merge completed with no source or status conflicts.
          - **TESTED:** Transfer payload SHA-256 was verified before application. `git am` recreated the exact source trees from the supplied bundle: first product-path tree `6fac2d10260344c154b6f79646223f8d5e1cea42`, final tree `73c8f83821c3112fc74da9d9117317dbf57b497a`. The integration merge itself completed cleanly in GitHub Actions. The product-path source evidence remains 232 test files, 231 passing and one environment-blocked Docker readiness test; browser proofs passed with the local root-safe Chromium wrapper; route authorization and standard release preflight passed. These results are source-branch evidence until the integrated PR CI completes.
          - **OPEN:** Integrated GitHub CI is still required before merge. O-1 Render Blueprint/live worker command sync, O-2 hosted `OTP_HASH_SALT`, F13 provider semantics, F-12 production image pruning, the F-07 architecture decision, and LONG_HORIZON_DEALS remain open as already recorded. Server-emitted legacy `/app/...` URLs and the missing canonical React payment-recovery screen remain the next product-path gap. REAL MONEY remains 0. Grow remains untouched and blocked.
          - **PERCENTAGE:** Technical readiness remains approximately **90%** for the closed-pilot product path. Closed-pilot readiness remains approximately **92%**. Real-money readiness remains **35%**. Integration transport and branch combination are **100% complete**; CI qualification is not yet complete.
          - **NEXT STEP:** Run and inspect all required GitHub CI on the integrated candidate. If green, use the integrated candidate as the single merge line rather than merging PR #18 and the product-path branch independently. After merge, complete the documented owner/runtime actions before any hosted pilot or real-money activation.

          EOF
            cat PROJECT_STATUS.md >> /tmp/status-block.md
            mv /tmp/status-block.md PROJECT_STATUS.md
          fi
          git add PROJECT_STATUS.md
          if git diff --cached --quiet; then
            echo 'PROJECT_STATUS already contains integration milestone.'
          else
            git commit -m 'docs(status): record integrated PR18 and product-path candidate'
          fi
          git push origin HEAD:refs/heads/$TARGET

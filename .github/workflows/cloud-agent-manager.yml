name: Siton Cloud Agent Manager

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task for the Siton agent team"
        required: true
        type: string
      builder:
        description: "Primary coding agent"
        required: true
        default: auto
        type: choice
        options: [auto, claude, codex]
      reviewer:
        description: "Reviewer"
        required: true
        default: auto
        type: choice
        options: [auto, claude, codex, none]
      scope:
        description: "Allowed scope"
        required: false
        default: "Smallest coherent repository scope required for the task."
        type: string
      do_not_touch:
        description: "Additional protected scope"
        required: false
        default: "Grow, real money, production side effects, unrelated product areas."
        type: string
      task_type:
        description: "Task classification"
        required: true
        default: auto
        type: choice
        options: [auto, frontend, backend, database, security, payments, tests, docs, ux, operations]
      risk:
        description: "Risk classification"
        required: true
        default: normal
        type: choice
        options: [low, normal, high, critical]
      model_tier:
        description: "Compute tier; sensitive work requires at least senior; apex needs evidence"
        required: true
        default: auto
        type: choice
        options: [auto, economy, standard, senior, apex]
      apex_reason:
        description: "Exceptional Apex escalation reason (otherwise none)"
        required: false
        default: none
        type: choice
        options: [none, cross-system-architecture, critical-cross-layer, conflicting-reviews, senior-investigation-exhausted]
      apex_evidence:
        description: "Apex only: affected layers, conflicting report refs or failed Senior attempts (40+ characters)"
        required: false
        type: string

# Job chain, each job on a fresh GitHub-hosted runner:
#
#   route ──> build ──> review-1 ──> fix ──> review-2 ──> finalize
#                          │  (only when review-1 needs a fix)  ▲
#                          └──────────────────────────────────────┘
#
# route    trusted routing only: credential presence, router, roles, model
#          access and the canonical master commit every later job starts from.
#          No agent code runs there, so the reviewer, models and base commit
#          cannot be influenced by a builder.
# build    the builder (Claude or Codex), its lifecycle and control-plane
#          boundary, canonical verification; exports the task patch.
# review-N a separate job (cloud-agent-review.yml) on a runner no builder ever
#          touched: control scripts are copied from master before the patch
#          is applied, and only those copies run after it. It receives only
#          its reviewer provider's credential and a read-only token.
# fix      at most one bounded fix pass by the original builder; re-verified;
#          exports patch v2.
# finalize applies the final reviewed patch (sha256-bound to the review job's
#          output), updates the status slot, commits and pushes as the sole
#          lifecycle owner, runs the required swarm, opens the PR (never
#          merges), and always records telemetry and reports to the issue.
#
# The default workflow token is read-only everywhere except `issues: write` in
# finalize, so a blocked run can still report to the phone. The trusted route
# job checks only whether SITON_AGENT_GITHUB_TOKEN exists; no agent runs there.
# Builder/fix/review jobs never reference that secret. Lifecycle commands consume
# it only in finalize so workflow-created branches/PRs can trigger normal CI.
permissions:
  contents: read

# Serializes cloud writers. GitHub concurrency retains only one pending run;
# it is not a durable FIFO queue. Submit the next task after the active run.
concurrency:
  group: siton-cloud-agent-manager-v1
  cancel-in-progress: false

env:
  CI: "true"
  NODE_ENV: test
  DISABLE_OUTBOX_WORKER: "1"
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/siton_cloud_agent
  PAYMENT_PROVIDER: mockpay
  PAYMENT_PROVIDER_MODE: mock-backed
  SITON_AGENT: cloud-manager
  CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
  # Optional per-tier model pins (repository variables). Empty means the tier
  # default from scripts/agent_model_tiers.cjs: Claude stable aliases, which
  # always resolve to the newest model of the family. Downgrading pins fail.
  SITON_CLAUDE_MODEL_ECONOMY: ${{ vars.SITON_CLAUDE_MODEL_ECONOMY }}
  SITON_CLAUDE_MODEL_STANDARD: ${{ vars.SITON_CLAUDE_MODEL_STANDARD }}
  SITON_CLAUDE_MODEL_SENIOR: ${{ vars.SITON_CLAUDE_MODEL_SENIOR }}
  SITON_CLAUDE_MODEL_APEX: ${{ vars.SITON_CLAUDE_MODEL_APEX }}
  SITON_CODEX_MODEL_ECONOMY: ${{ vars.SITON_CODEX_MODEL_ECONOMY }}
  SITON_CODEX_MODEL_STANDARD: ${{ vars.SITON_CODEX_MODEL_STANDARD }}
  SITON_CODEX_MODEL_SENIOR: ${{ vars.SITON_CODEX_MODEL_SENIOR }}
  SITON_CODEX_MODEL_APEX: ${{ vars.SITON_CODEX_MODEL_APEX }}

jobs:
  route:
    name: Route task and resolve credentials
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      started_epoch: ${{ steps.clock.outputs.started_epoch }}
      base_sha: ${{ steps.base.outputs.sha }}
      credential_state: ${{ steps.credentials.outputs.state_b64 }}
      claude_auth: ${{ steps.credentials.outputs.claude_auth }}
      builder: ${{ steps.roles.outputs.builder }}
      reviewer: ${{ steps.roles.outputs.reviewer }}
      independent_review: ${{ steps.roles.outputs.independent_review }}
      branch: ${{ steps.roles.outputs.branch }}
      type: ${{ steps.roles.outputs.type }}
      risk: ${{ steps.roles.outputs.risk }}
      tier: ${{ steps.roles.outputs.tier }}
      sensitive: ${{ steps.roles.outputs.sensitive }}
      apex_reason: ${{ steps.roles.outputs.apex_reason }}
      codex_model: ${{ steps.roles.outputs.codex_model }}
      claude_model: ${{ steps.roles.outputs.claude_model }}
      claude_model_args: ${{ steps.roles.outputs.claude_model_args }}
      claude_reviewer_model: ${{ steps.roles.outputs.claude_reviewer_model }}
      claude_reviewer_model_args: ${{ steps.roles.outputs.claude_reviewer_model_args }}
      builder_effort: ${{ steps.roles.outputs.builder_effort }}
      reviewer_effort: ${{ steps.roles.outputs.reviewer_effort }}
    steps:
      - name: Start run clock
        id: clock
        run: echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout canonical master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: false

      - name: Record task base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Record cloud credential state
        id: credentials
        env:
          OPENAI_KEY_VALUE: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_KEY_VALUE: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_OAUTH_VALUE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MANAGER_GH_TOKEN_VALUE: ${{ secrets.SITON_AGENT_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          has_codex=false
          has_claude=false
          claude_auth=none
          blocked=false
          if [ -n "$OPENAI_KEY_VALUE" ]; then has_codex=true; fi
          if [ -n "$ANTHROPIC_KEY_VALUE" ]; then has_claude=true; claude_auth=api; fi
          if [ "$has_claude" = false ] && [ -n "$CLAUDE_OAUTH_VALUE" ]; then has_claude=true; claude_auth=oauth; fi

          # Presence only. No secret value is compared, printed or written anywhere.
          {
            echo "### Cloud credential state"
            echo
            echo "- SITON_AGENT_GITHUB_TOKEN: $([ -n "$MANAGER_GH_TOKEN_VALUE" ] && echo present || echo MISSING)"
            echo "- OPENAI_API_KEY: $([ -n "$OPENAI_KEY_VALUE" ] && echo present || echo MISSING)"
            echo "- Claude credential: $claude_auth"
          } > /tmp/siton-credential-blocker.md

          if [ -z "$MANAGER_GH_TOKEN_VALUE" ] || { [ "$has_codex" = false ] && [ "$has_claude" = false ]; }; then
            blocked=true
            {
              echo
              echo "### BLOCKER REQUIRES OWNER ACTION"
              echo
              if [ -z "$MANAGER_GH_TOKEN_VALUE" ]; then
                echo "SITON_AGENT_GITHUB_TOKEN is required for autonomous branch/PR lifecycle and downstream CI triggering."
                echo "Create a fine-grained personal access token scoped to this repository with Actions, Contents, Issues and Pull requests set to Read and write, then add it as an Actions secret named SITON_AGENT_GITHUB_TOKEN."
              fi
              if [ "$has_codex" = false ] && [ "$has_claude" = false ]; then
                echo "No coding-agent credential is configured. Add OPENAI_API_KEY, ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN."
              fi
              echo
              echo "Secrets page: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/settings/secrets/actions"
              echo "Then re-run Siton Cloud Credential Preflight to confirm before queuing work again."
            } >> /tmp/siton-credential-blocker.md
          elif [ "$has_codex" = false ] || [ "$has_claude" = false ]; then
            echo "Only one agent provider is configured; cross-provider independent review is unavailable for this run." >> /tmp/siton-credential-blocker.md
          fi
          {
            echo "claude_auth=$claude_auth"
            echo "has_codex=$has_codex"
            echo "has_claude=$has_claude"
            echo "blocked=$blocked"
            echo "state_b64=$(base64 -w0 /tmp/siton-credential-blocker.md)"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve cloud credentials and roles
        id: roles
        env:
          BLOCKED: ${{ steps.credentials.outputs.blocked }}
          HAS_CODEX: ${{ steps.credentials.outputs.has_codex }}
          HAS_CLAUDE: ${{ steps.credentials.outputs.has_claude }}
          REQUESTED_BUILDER: ${{ github.event_name == 'workflow_dispatch' && inputs.builder || 'auto' }}
          REQUESTED_REVIEWER: ${{ github.event_name == 'workflow_dispatch' && inputs.reviewer || 'auto' }}
          SITON_TASK: ${{ inputs.task }}
          SITON_ISSUE_BODY: ${{ inputs.task }}
          SITON_APEX_REASON: ${{ inputs.apex_reason }}
          SITON_APEX_EVIDENCE: ${{ inputs.apex_evidence }}
          SITON_TASK_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.task_type || 'auto' }}
          SITON_RISK: ${{ github.event_name == 'workflow_dispatch' && inputs.risk || 'normal' }}
          SITON_MODEL_TIER: ${{ github.event_name == 'workflow_dispatch' && inputs.model_tier || 'auto' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BLOCKED" != false ]; then
            cat /tmp/siton-credential-blocker.md >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/siton-credential-blocker.md >&2
            exit 1
          fi
          manager_output="$GITHUB_OUTPUT"
          export GITHUB_OUTPUT=/tmp/siton-route-output
          node scripts/agent_router.cjs route
          cat /tmp/siton-route-output >> "$manager_output"
          # Load only values generated by our own router. No issue text is evaluated.
          while IFS='=' read -r key value; do
            case "$key" in
              builder|reviewer|codex_model|claude_model|claude_reviewer_model|builder_effort|reviewer_effort|tier|type|risk|sensitive) printf -v "$key" '%s' "$value" ;;
            esac
          done < /tmp/siton-route-output
          export GITHUB_OUTPUT="$manager_output"
          selected_builder="$REQUESTED_BUILDER"
          selected_reviewer="$REQUESTED_REVIEWER"
          if [ "$selected_builder" = auto ]; then selected_builder="$builder"; fi
          if [ "$selected_reviewer" = auto ]; then selected_reviewer="$reviewer"; fi
          export SITON_MODEL_TIER="$tier"
          node scripts/cloud_agent_manager.cjs roles "$selected_builder" "$selected_reviewer"
          case "$selected_builder" in claude|codex) ;; *) echo "invalid builder: $selected_builder" >&2; exit 1 ;; esac
          echo "branch=agent/cloud/${selected_builder}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Verify selected Codex model access
        if: steps.roles.outputs.builder == 'codex' || steps.roles.outputs.reviewer == 'codex'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SITON_CODEX_MODEL: ${{ steps.roles.outputs.codex_model }}
        run: node scripts/agent_model_access.cjs

  build:
    name: Build and verify
    needs: route
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      pull-requests: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: siton_cloud_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d siton_cloud_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    outputs:
      patch_sha256: ${{ steps.export.outputs.patch_sha256 }}
    steps:
      - name: Checkout canonical master at the task base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.route.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Clean dependency install
        run: npm ci

      - name: Create isolated task branch and packet
        env:
          SITON_TASK: ${{ inputs.task }}
          SITON_SCOPE: ${{ inputs.scope }}
          SITON_DO_NOT_TOUCH: ${{ inputs.do_not_touch }}
          SITON_TASK_SOURCE: ${{ format('workflow_dispatch run {0}', github.run_id) }}
          SITON_BUILDER: ${{ needs.route.outputs.builder }}
          SITON_REVIEWER: ${{ needs.route.outputs.reviewer }}
          BRANCH: ${{ needs.route.outputs.branch }}
          BASE_SHA: ${{ needs.route.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git switch -c "$BRANCH" "$BASE_SHA"
          printf '%s\n' '.siton-cloud-task.md' '.siton-review-prompt.md' '.siton-review-1.txt' '.siton-review-2.txt' '.siton-fix-task.md' >> .git/info/exclude
          node scripts/cloud_agent_manager.cjs packet .siton-cloud-task.md

      - name: Claude builder
        id: claude_build
        if: needs.route.outputs.builder == 'claude'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ needs.route.outputs.claude_auth == 'api' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ needs.route.outputs.claude_auth == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          github_token: ${{ github.token }}
          prompt: "Read .siton-cloud-task.md and execute the task completely. Follow the packet literally. Do not commit, push, merge, open a PR, or edit PROJECT_STATUS.md."
          claude_args: >-
            ${{ needs.route.outputs.claude_model_args }}
            --max-turns 24
            --allowedTools Read Glob Grep Edit MultiEdit Write NotebookEdit TodoWrite
            "Bash(npm run:*)" "Bash(npm test:*)" "Bash(npx:*)" "Bash(node:*)"
            "Bash(git diff:*)" "Bash(git status:*)" "Bash(git log:*)" "Bash(git show:*)"
            --disallowedTools WebSearch WebFetch
          show_full_output: false

      - name: Codex builder
        id: codex_build
        if: needs.route.outputs.builder == 'codex'
        uses: openai/codex-action@v1
        with:
          allow-bot-users: "github-actions[bot]"
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: .siton-cloud-task.md
          model: ${{ needs.route.outputs.codex_model }}
          effort: ${{ needs.route.outputs.builder_effort }}
          safety-strategy: drop-sudo

      # In-job check on the builder's own runner. It stops an honest mistake
      # early; the authoritative check is repeated from a control copy on the
      # fresh review and finalize runners, which no builder can reach.
      - name: Enforce builder lifecycle and control-plane boundary
        env:
          EXPECTED_BRANCH: ${{ needs.route.outputs.branch }}
          EXPECTED_HEAD: ${{ needs.route.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH" || { echo "Builder changed branch" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" || { echo "Builder committed or changed HEAD; Git lifecycle belongs to the manager" >&2; exit 1; }
          protected='^(\.github/|scripts/cloud_agent_manager\.cjs$|scripts/agent_readonly_bash_guard\.cjs$|scripts/agent_router\.cjs$|scripts/agent_model_tiers\.cjs$|AI_WORKFLOW\.md$|PROJECT_STATUS\.md$|\.siton-|\.mcp\.json$|(.*/)?(AGENTS|CLAUDE)(\.[A-Za-z0-9_-]+)*\.md$|(.*/)?\.claude/|(.*/)?\.codex/)'
          git status --porcelain=v1 -z --untracked-files=all --no-renames > "$RUNNER_TEMP/siton-build-status.z"
          if cut -z -c4- "$RUNNER_TEMP/siton-build-status.z" | grep -zE "$protected" | tr '\0' '\n'; then
            echo "Builder modified the cloud-manager control plane or shared status" >&2
            exit 1
          fi

      - name: Require intentional task diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Cloud builder produced no repository changes." >&2
            exit 1
          fi

      - name: Canonical verification after build
        run: node scripts/siton_verify.cjs

      # The patch leaves this runner as data only. Review and finalize apply it
      # on fresh runners; they never run anything the builder wrote. It is
      # exported with hooks, fsmonitor, external diff and textconv disabled.
      - name: Export task patch without credentials
        id: export
        env:
          BASE_SHA: ${{ needs.route.outputs.base_sha }}
          BUILDER: ${{ needs.route.outputs.builder }}
          REVIEWER: ${{ needs.route.outputs.reviewer }}
        shell: bash
        run: |
          set -euo pipefail
          safe_git() { git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c diff.external= "$@"; }
          out="$RUNNER_TEMP/siton-patch"
          rm -rf "$out"
          mkdir -p "$out"
          safe_git add -A
          if safe_git diff --cached --quiet; then
            echo "No staged changes after managed task." >&2
            exit 1
          fi
          safe_git diff --cached --binary --no-ext-diff --no-textconv "$BASE_SHA" > "$out/siton-managed.patch"
          test -s "$out/siton-managed.patch"
          # Evidence only: the review job regenerates packet and prompt from
          # the owner's inputs and the route outputs with its control copy.
          cp .siton-cloud-task.md "$out/siton-cloud-task.md"
          printf '{"builder":"%s","reviewer":"%s","base_sha":"%s","base_ref":"HEAD"}\n' "$BUILDER" "$REVIEWER" "$BASE_SHA" > "$out/review-inputs.json"
          echo "patch_sha256=$(sha256sum "$out/siton-managed.patch" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload task patch
        uses: actions/upload-artifact@v4
        with:
          name: siton-patch-1
          path: ${{ runner.temp }}/siton-patch
          if-no-files-found: error
          retention-days: 14

      - name: Collect builder execution record
        if: always() && needs.route.outputs.builder == 'claude'
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude_build.outputs.execution_file }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/siton-exec"
          if [ -n "$CLAUDE_EXECUTION_FILE" ] && [ -f "$CLAUDE_EXECUTION_FILE" ]; then cp "$CLAUDE_EXECUTION_FILE" "$RUNNER_TEMP/siton-exec/claude-execution.json"; fi

      - name: Upload builder execution record
        if: always() && needs.route.outputs.builder == 'claude'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: siton-exec-build
          path: ${{ runner.temp }}/siton-exec
          if-no-files-found: ignore
          retention-days: 14

  review-1:
    name: Review pass 1
    needs: [route, build]
    if: needs.route.outputs.reviewer != 'none'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/cloud-agent-review.yml
    with:
      pass: "1"
      patch_artifact: siton-patch-1
      base_sha: ${{ needs.route.outputs.base_sha }}
      builder: ${{ needs.route.outputs.builder }}
      reviewer: ${{ needs.route.outputs.reviewer }}
      claude_auth: ${{ needs.route.outputs.claude_auth }}
      claude_reviewer_model_args: ${{ needs.route.outputs.claude_reviewer_model_args }}
      codex_model: ${{ needs.route.outputs.codex_model }}
      reviewer_effort: ${{ needs.route.outputs.reviewer_effort }}
      task: ${{ inputs.task }}
      scope: ${{ inputs.scope }}
      do_not_touch: ${{ inputs.do_not_touch }}
    # Only the selected reviewer provider's credential reaches the review job.
    secrets:
      openai_api_key: ${{ needs.route.outputs.reviewer == 'codex' && secrets.OPENAI_API_KEY || '' }}
      anthropic_api_key: ${{ needs.route.outputs.reviewer == 'claude' && needs.route.outputs.claude_auth == 'api' && secrets.ANTHROPIC_API_KEY || '' }}
      claude_code_oauth_token: ${{ needs.route.outputs.reviewer == 'claude' && needs.route.outputs.claude_auth == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}

  fix:
    name: One bounded fix pass
    needs: [route, build, review-1]
    if: needs.review-1.outputs.needs_fix == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: siton_cloud_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d siton_cloud_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    outputs:
      patch_sha256: ${{ steps.export.outputs.patch_sha256 }}
    steps:
      - name: Checkout canonical master at the task base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.route.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Clean dependency install
        run: npm ci

      - name: Download reviewed patch
        uses: actions/download-artifact@v4
        with:
          name: siton-patch-1
          path: ${{ runner.temp }}/siton-patch-1

      - name: Download review findings
        uses: actions/download-artifact@v4
        with:
          name: siton-review-1
          path: ${{ runner.temp }}/siton-review-1

      # The fix pass starts from exactly the bytes review pass 1 judged.
      - name: Rebuild the reviewed task state
        env:
          SITON_TASK: ${{ inputs.task }}
          SITON_SCOPE: ${{ inputs.scope }}
          SITON_DO_NOT_TOUCH: ${{ inputs.do_not_touch }}
          SITON_TASK_SOURCE: ${{ format('workflow_dispatch run {0}', github.run_id) }}
          SITON_BUILDER: ${{ needs.route.outputs.builder }}
          SITON_REVIEWER: ${{ needs.route.outputs.reviewer }}
          BRANCH: ${{ needs.route.outputs.branch }}
          BASE_SHA: ${{ needs.route.outputs.base_sha }}
          REVIEWED_PATCH_SHA256: ${{ needs.review-1.outputs.patch_sha256 }}
          REVIEW_SHA256: ${{ needs.review-1.outputs.review_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          safe_git() { git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c diff.external= "$@"; }
          patch="$RUNNER_TEMP/siton-patch-1/siton-managed.patch"
          review="$RUNNER_TEMP/siton-review-1/review.txt"
          { test -f "$patch" && test ! -L "$patch" && test -s "$patch"; } || { echo "reviewed patch missing or not a regular file" >&2; exit 1; }
          { test -f "$review" && test ! -L "$review"; } || { echo "review findings missing or not a regular file" >&2; exit 1; }
          { [[ "$REVIEWED_PATCH_SHA256" =~ ^[0-9a-f]{64}$ ]] && [[ "$REVIEW_SHA256" =~ ^[0-9a-f]{64}$ ]]; } || { echo "review pass 1 returned no digests" >&2; exit 1; }
          echo "$REVIEWED_PATCH_SHA256  $patch" | sha256sum -c --quiet -
          echo "$REVIEW_SHA256  $review" | sha256sum -c --quiet -
          git switch -c "$BRANCH" "$BASE_SHA"
          printf '%s\n' '.siton-cloud-task.md' '.siton-review-prompt.md' '.siton-review-1.txt' '.siton-review-2.txt' '.siton-fix-task.md' >> .git/info/exclude
          node scripts/cloud_agent_manager.cjs packet .siton-cloud-task.md
          # Into the index as well, exactly as the review job applied it, so a
          # reviewed file under a .gitignore path is not silently dropped.
          safe_git apply --index --binary "$patch"
          cp "$review" .siton-review-1.txt

      - name: Prepare one bounded fix pass
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const packet = fs.readFileSync('.siton-cloud-task.md', 'utf8');
          const review = fs.readFileSync('.siton-review-1.txt', 'utf8');
          fs.writeFileSync('.siton-fix-task.md', `${packet}\n\n# REVIEW FINDINGS\n${review}\n\nFix only valid findings required for the original task. Do not broaden scope. Do not commit, push, merge, open a PR, or edit PROJECT_STATUS.md.\n`);
          NODE

      - name: Claude bounded fix pass
        id: claude_fix
        if: needs.route.outputs.builder == 'claude'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ needs.route.outputs.claude_auth == 'api' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ needs.route.outputs.claude_auth == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          github_token: ${{ github.token }}
          prompt: "Read .siton-fix-task.md. Address the valid review findings within the original scope. This is the only automatic fix pass. Do not commit, push, merge, open a PR, or edit PROJECT_STATUS.md."
          claude_args: >-
            ${{ needs.route.outputs.claude_model_args }}
            --max-turns 18
            --allowedTools Read Glob Grep Edit MultiEdit Write NotebookEdit TodoWrite
            "Bash(npm run:*)" "Bash(npm test:*)" "Bash(npx:*)" "Bash(node:*)"
            "Bash(git diff:*)" "Bash(git status:*)" "Bash(git log:*)" "Bash(git show:*)"
            --disallowedTools WebSearch WebFetch
          show_full_output: false

      - name: Codex bounded fix pass
        if: needs.route.outputs.builder == 'codex'
        uses: openai/codex-action@v1
        with:
          allow-bot-users: "github-actions[bot]"
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: .siton-fix-task.md
          model: ${{ needs.route.outputs.codex_model }}
          effort: ${{ needs.route.outputs.builder_effort }}
          safety-strategy: drop-sudo

      - name: Enforce fix-pass lifecycle and control-plane boundary
        env:
          EXPECTED_BRANCH: ${{ needs.route.outputs.branch }}
          EXPECTED_HEAD: ${{ needs.route.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH" || { echo "Fix pass changed branch" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" || { echo "Fix pass committed or changed HEAD; Git lifecycle belongs to the manager" >&2; exit 1; }
          protected='^(\.github/|scripts/cloud_agent_manager\.cjs$|scripts/agent_readonly_bash_guard\.cjs$|scripts/agent_router\.cjs$|scripts/agent_model_tiers\.cjs$|AI_WORKFLOW\.md$|PROJECT_STATUS\.md$|\.siton-|\.mcp\.json$|(.*/)?(AGENTS|CLAUDE)(\.[A-Za-z0-9_-]+)*\.md$|(.*/)?\.claude/|(.*/)?\.codex/)'
          git status --porcelain=v1 -z --untracked-files=all --no-renames > "$RUNNER_TEMP/siton-fix-status.z"
          if cut -z -c4- "$RUNNER_TEMP/siton-fix-status.z" | grep -zE "$protected" | tr '\0' '\n'; then
            echo "Fix pass modified the cloud-manager control plane or shared status" >&2
            exit 1
          fi

      - name: Re-verify after bounded fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node scripts/siton_verify.cjs

      - name: Export fixed patch without credentials
        id: export
        env:
          BASE_SHA: ${{ needs.route.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          safe_git() { git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c diff.external= "$@"; }
          out="$RUNNER_TEMP/siton-patch-2"
          rm -rf "$out"
          mkdir -p "$out"
          safe_git add -A
          if safe_git diff --cached --quiet; then
            echo "No staged changes after the bounded fix pass." >&2
            exit 1
          fi
          safe_git diff --cached --binary --no-ext-diff --no-textconv "$BASE_SHA" > "$out/siton-managed.patch"
          test -s "$out/siton-managed.patch"
          cp .siton-fix-task.md "$out/siton-fix-task.md"
          echo "patch_sha256=$(sha256sum "$out/siton-managed.patch" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload fixed patch
        uses: actions/upload-artifact@v4
        with:
          name: siton-patch-2
          path: ${{ runner.temp }}/siton-patch-2
          if-no-files-found: error
          retention-days: 14

      - name: Collect fix execution record
        if: always() && needs.route.outputs.builder == 'claude'
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude_fix.outputs.execution_file }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/siton-exec"
          if [ -n "$CLAUDE_EXECUTION_FILE" ] && [ -f "$CLAUDE_EXECUTION_FILE" ]; then cp "$CLAUDE_EXECUTION_FILE" "$RUNNER_TEMP/siton-exec/claude-execution.json"; fi

      - name: Upload fix execution record
        if: always() && needs.route.outputs.builder == 'claude'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: siton-exec-fix
          path: ${{ runner.temp }}/siton-exec
          if-no-files-found: ignore
          retention-days: 14

  review-2:
    name: Review pass 2
    needs: [route, review-1, fix]
    if: needs.review-1.outputs.needs_fix == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/cloud-agent-review.yml
    with:
      pass: "2"
      patch_artifact: siton-patch-2
      base_sha: ${{ needs.route.outputs.base_sha }}
      builder: ${{ needs.route.outputs.builder }}
      reviewer: ${{ needs.route.outputs.reviewer }}
      claude_auth: ${{ needs.route.outputs.claude_auth }}
      claude_reviewer_model_args: ${{ needs.route.outputs.claude_reviewer_model_args }}
      codex_model: ${{ needs.route.outputs.codex_model }}
      reviewer_effort: ${{ needs.route.outputs.reviewer_effort }}
      task: ${{ inputs.task }}
      scope: ${{ inputs.scope }}
      do_not_touch: ${{ inputs.do_not_touch }}
    # Only the selected reviewer provider's credential reaches the review job.
    secrets:
      openai_api_key: ${{ needs.route.outputs.reviewer == 'codex' && secrets.OPENAI_API_KEY || '' }}
      anthropic_api_key: ${{ needs.route.outputs.reviewer == 'claude' && needs.route.outputs.claude_auth == 'api' && secrets.ANTHROPIC_API_KEY || '' }}
      claude_code_oauth_token: ${{ needs.route.outputs.reviewer == 'claude' && needs.route.outputs.claude_auth == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}

  finalize:
    name: Finalize, report and record telemetry
    needs: [route, build, review-1, fix, review-2]
    # Runs after every outcome so telemetry and the issue report never go
    # silent; the lifecycle steps below require every upstream job to succeed.
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout canonical master at the task base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.route.outputs.base_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Copy control scripts before the patch
        shell: bash
        run: |
          set -euo pipefail
          CONTROL="$RUNNER_TEMP/control"
          rm -rf "$CONTROL"
          mkdir -p "$CONTROL"
          cp scripts/cloud_agent_manager.cjs scripts/agent_readonly_bash_guard.cjs scripts/agent_router.cjs scripts/agent_model_tiers.cjs "$CONTROL/"
          chmod -R a-w "$CONTROL"

      - name: Collect upstream job results
        id: upstream
        env:
          ROUTE: ${{ needs.route.result }}
          BUILD: ${{ needs.build.result }}
          REVIEW1: ${{ needs.review-1.result }}
          FIX: ${{ needs.fix.result }}
          REVIEW2: ${{ needs.review-2.result }}
          REVIEWER: ${{ needs.route.outputs.reviewer }}
          NEEDS_FIX: ${{ needs.review-1.outputs.needs_fix }}
        shell: bash
        run: |
          set -uo pipefail
          status=success
          [ "$ROUTE" = success ] || status=failure
          [ "$BUILD" = success ] || status=failure
          if [ "$REVIEWER" = none ]; then
            { [ "$REVIEW1" = skipped ] && [ "$FIX" = skipped ] && [ "$REVIEW2" = skipped ]; } || status=failure
          else
            [ "$REVIEW1" = success ] || status=failure
            if [ "$NEEDS_FIX" = true ]; then
              { [ "$FIX" = success ] && [ "$REVIEW2" = success ]; } || status=failure
            else
              { [ "$FIX" = skipped ] && [ "$REVIEW2" = skipped ]; } || status=failure
            fi
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Upstream: route=$ROUTE build=$BUILD review-1=$REVIEW1 fix=$FIX review-2=$REVIEW2 -> $status" >> "$GITHUB_STEP_SUMMARY"

      - name: Require every upstream job
        env:
          UPSTREAM: ${{ steps.upstream.outputs.status }}
        run: test "$UPSTREAM" = success || { echo "An upstream job failed or was skipped; no branch, commit or PR is created." >&2; exit 1; }

      - name: Download final task patch
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.review-1.outputs.needs_fix == 'true' && 'siton-patch-2' || 'siton-patch-1' }}
          path: ${{ runner.temp }}/siton-final-patch

      - name: Download final review evidence
        if: needs.route.outputs.reviewer != 'none'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.review-1.outputs.needs_fix == 'true' && 'siton-review-2' || 'siton-review-1' }}
          path: ${{ runner.temp }}/siton-final-review

      # The verdict comes from the review job's outputs, which only that job's
      # fresh runner can set. The review text is bound to it by sha256 and
      # re-parsed with the control copy; any mismatch fails closed.
      - name: Select final review verdict
        id: final_review
        env:
          REVIEWER: ${{ needs.route.outputs.reviewer }}
          NEEDED_FIX: ${{ needs.review-1.outputs.needs_fix }}
          VERDICT_1: ${{ needs.review-1.outputs.verdict }}
          VERDICT_2: ${{ needs.review-2.outputs.verdict }}
          REVIEW_SHA256_1: ${{ needs.review-1.outputs.review_sha256 }}
          REVIEW_SHA256_2: ${{ needs.review-2.outputs.review_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$REVIEWER" = "none" ]; then
            echo "verdict=NOT_RUN" >> "$GITHUB_OUTPUT"
            echo "needs_fix=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$NEEDED_FIX" = "true" ]; then expected="$VERDICT_2"; review_sha="$REVIEW_SHA256_2"; else expected="$VERDICT_1"; review_sha="$REVIEW_SHA256_1"; fi
          case "$expected" in PASS|CHANGES_REQUIRED|INVALID) ;; *) echo "review job returned no valid verdict" >&2; exit 1 ;; esac
          review="$RUNNER_TEMP/siton-final-review/review.txt"
          { test -f "$review" && test ! -L "$review"; } || { echo "final review text missing or not a regular file" >&2; exit 1; }
          [[ "$review_sha" =~ ^[0-9a-f]{64}$ ]] || { echo "review job returned no review digest" >&2; exit 1; }
          echo "$review_sha  $review" | sha256sum -c --quiet -
          GITHUB_OUTPUT="$RUNNER_TEMP/siton-final-verdict" node "$RUNNER_TEMP/control/cloud_agent_manager.cjs" review "$review"
          parsed=$(sed -n 's/^verdict=//p' "$RUNNER_TEMP/siton-final-verdict" | tail -n1)
          test "$parsed" = "$expected" || { echo "review text does not match the review job verdict" >&2; exit 1; }
          {
            echo "verdict=$expected"
            echo "needs_fix=$([ "$expected" = PASS ] && echo false || echo true)"
            echo "review_file=$review"
          } >> "$GITHUB_OUTPUT"

      - name: Apply final reviewed patch and enforce control-plane boundary
        env:
          REVIEWER: ${{ needs.route.outputs.reviewer }}
          NEEDED_FIX: ${{ needs.review-1.outputs.needs_fix }}
          BUILD_PATCH_SHA256: ${{ needs.build.outputs.patch_sha256 }}
          REVIEWED_PATCH_SHA256_1: ${{ needs.review-1.outputs.patch_sha256 }}
          REVIEWED_PATCH_SHA256_2: ${{ needs.review-2.outputs.patch_sha256 }}
          BASE_SHA: ${{ needs.route.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          safe_git() { git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c diff.external= "$@"; }
          if [ "$REVIEWER" = none ]; then expected="$BUILD_PATCH_SHA256"
          elif [ "$NEEDED_FIX" = true ]; then expected="$REVIEWED_PATCH_SHA256_2"
          else expected="$REVIEWED_PATCH_SHA256_1"; fi
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || { echo "no reviewed patch digest" >&2; exit 1; }
          patch="$RUNNER_TEMP/siton-final-patch/siton-managed.patch"
          { test -f "$patch" && test ! -L "$patch" && test -s "$patch"; } || { echo "final patch missing or not a regular file" >&2; exit 1; }
          echo "$expected  $patch" | sha256sum -c --quiet - || { echo "final patch differs from the reviewed patch" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          # --index, exactly as the review job applied it: a reviewed file whose
          # path is ignored by .gitignore stays in the commit instead of being
          # skipped by `git add -A`.
          safe_git apply --index --binary "$patch"
          safe_git status --porcelain=v1 -z --untracked-files=all --no-renames | node "$RUNNER_TEMP/control/cloud_agent_manager.cjs" boundary
          if [ -z "$(safe_git status --porcelain --untracked-files=all)" ]; then
            echo "Final patch produced no repository changes." >&2
            exit 1
          fi

      - name: Update project status and final diff checks
        env:
          STATUS_BRANCH: ${{ needs.route.outputs.branch }}
          STATUS_BUILDER: ${{ needs.route.outputs.builder }}
          STATUS_REVIEWER: ${{ needs.route.outputs.reviewer }}
          STATUS_COMPLETED: "Cloud-managed task executed on GitHub-hosted runners; builder completed the task, review ran in a separate job on a fresh runner, and the manager performed canonical verification."
          STATUS_TESTED: "git diff --check and node scripts/siton_verify.cjs passed on a disposable local PostgreSQL service in GitHub Actions."
          STATUS_OPEN: ${{ steps.final_review.outputs.verdict == 'CHANGES_REQUIRED' && 'Final review still requires changes after the single bounded fix pass; PR will remain draft for follow-up.' || 'No manager-side blocker remains; merge remains owner-controlled and repository CI remains authoritative.' }}
          STATUS_PERCENTAGE: ${{ steps.final_review.outputs.verdict == 'CHANGES_REQUIRED' && '80%' || '95% pending PR merge' }}
          STATUS_NEXT: ${{ steps.final_review.outputs.verdict == 'CHANGES_REQUIRED' && 'Address final reviewer findings in a fresh bounded run; do not loop automatically.' || 'Open PR, let repository CI run, then merge only when required checks are green.' }}
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/control/cloud_agent_manager.cjs" status PROJECT_STATUS.md
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false diff --check

      # Black-Sky E3: no agent ever ran on this runner, so this checkout's
      # .git (hooks, config, filters) is pristine, and the patch was applied
      # as data (git apply refuses paths inside .git). The lifecycle token
      # appears only here and in the steps after it, never on a runner where
      # a builder or reviewer ran. The trusted route job performs only a presence
      # check for the lifecycle secret; no agent runs there. Commit and push
      # stay hook-free anyway.
      - name: Commit and push managed branch
        env:
          BRANCH: ${{ needs.route.outputs.branch }}
          BASE_SHA: ${{ needs.route.outputs.base_sha }}
          GH_TOKEN: ${{ secrets.SITON_AGENT_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git config user.name "siton-agent-manager[bot]"
          git config user.email "siton-agent-manager[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null switch -c "$BRANCH"
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false add -A
          if git -c core.hooksPath=/dev/null diff --cached --quiet; then
            echo "No staged changes after managed task." >&2
            exit 1
          fi
          git -c core.hooksPath=/dev/null commit --no-verify -m "agent(cloud): managed run ${GITHUB_RUN_ID}"
          gh auth setup-git
          git -c core.hooksPath=/dev/null push --no-verify -u origin "$BRANCH"

      - name: Run required parallel analysis swarm
        id: swarm
        if: needs.route.outputs.sensitive == 'true' || needs.route.outputs.tier == 'apex'
        env:
          GH_TOKEN: ${{ secrets.SITON_AGENT_GITHUB_TOKEN }}
          BRANCH: ${{ needs.route.outputs.branch }}
          SITON_TASK: ${{ inputs.task }}
          SITON_RISK: ${{ needs.route.outputs.risk }}
          SITON_APEX_REASON: ${{ needs.route.outputs.apex_reason }}
          SITON_APEX_EVIDENCE: ${{ inputs.apex_evidence }}
        shell: bash
        run: |
          set -euo pipefail
          request_id="manager-${GITHUB_RUN_ID}"
          gh workflow run cloud-analysis-swarm.yml --repo "$GITHUB_REPOSITORY" --ref master \
            -f task="$SITON_TASK" \
            -f target_ref="$BRANCH" \
            -f request_id="$request_id" \
            -f risk="$SITON_RISK" \
            -f apex_reason="${SITON_APEX_REASON:-none}" \
            -f apex_evidence="${SITON_APEX_EVIDENCE:-}"

          run_id=""
          for _ in $(seq 1 30); do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow cloud-analysis-swarm.yml --event workflow_dispatch --limit 50 --json databaseId,displayTitle --jq ".[] | select(.displayTitle == \"Siton Analysis ${request_id}\") | .databaseId" | head -n1)
            if [ -n "$run_id" ]; then break; fi
            sleep 2
          done
          if [ -z "$run_id" ]; then
            echo "Could not locate analysis swarm run for $request_id" >&2
            exit 1
          fi

          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          run_url=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          rm -rf /tmp/siton-swarm
          mkdir -p /tmp/siton-swarm
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n "swarm-synthesis-${run_id}" -D /tmp/siton-swarm
          synthesis=$(find /tmp/siton-swarm -type f -name 'swarm-synthesis.md' -print -quit)
          if [ -z "$synthesis" ]; then
            echo "Analysis swarm synthesis artifact missing" >&2
            exit 1
          fi
          verdict=$(grep -E '^VERDICT=(PASS|FINDINGS)$' "$synthesis" | tail -n1 | cut -d= -f2 || true)
          if [ -z "$verdict" ]; then
            echo "Analysis swarm returned no machine-readable verdict" >&2
            cat "$synthesis" >&2
            exit 1
          fi
          cp "$synthesis" /tmp/siton-swarm-synthesis.md
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "url=$run_url" >> "$GITHUB_OUTPUT"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: Open Pull Request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.SITON_AGENT_GITHUB_TOKEN }}
          BRANCH: ${{ needs.route.outputs.branch }}
          BUILDER: ${{ needs.route.outputs.builder }}
          REVIEWER: ${{ needs.route.outputs.reviewer }}
          INDEPENDENT_REVIEW: ${{ needs.route.outputs.independent_review }}
          VERDICT: ${{ steps.final_review.outputs.verdict }}
          SWARM_VERDICT: ${{ steps.swarm.outputs.verdict }}
          SWARM_URL: ${{ steps.swarm.outputs.url }}
          SITON_TASK: ${{ inputs.task }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const task = String(process.env.SITON_TASK || '').trim().slice(0, 3000);
          fs.writeFileSync('/tmp/cloud-pr-body.md', `Cloud Agent Manager run ${process.env.GITHUB_RUN_ID}\n\nBuilder: ${process.env.BUILDER}\nReviewer: ${process.env.REVIEWER}\nIndependent review: ${process.env.INDEPENDENT_REVIEW}\nReview isolation: separate job on a fresh runner\nFinal reviewer verdict: ${process.env.VERDICT}\nParallel analysis verdict: ${process.env.SWARM_VERDICT || 'NOT_REQUIRED'}\nParallel analysis run: ${process.env.SWARM_URL || 'not required'}\n\nTask\n${task}\n\nVerification\n- git diff --check: PASS\n- canonical siton_verify: PASS\n- real money: 0\n- Grow: untouched\n- auto-merge: disabled\n`);
          NODE
          draft_arg=""
          if [ "$VERDICT" = "CHANGES_REQUIRED" ] || [ "$VERDICT" = "INVALID" ] || [ "${SWARM_VERDICT:-}" = "FINDINGS" ]; then draft_arg="--draft"; fi
          pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$BRANCH" --title "Cloud agent manager run ${GITHUB_RUN_ID}" --body-file /tmp/cloud-pr-body.md $draft_arg)
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "CLOUD_AGENT_PR=$pr_url"

      - name: Attach reviewer evidence to PR
        if: needs.route.outputs.reviewer != 'none'
        env:
          GH_TOKEN: ${{ secrets.SITON_AGENT_GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
          REVIEW_FILE: ${{ steps.final_review.outputs.review_file }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment "$PR_URL" --body-file "$REVIEW_FILE"

      - name: Attach parallel analysis evidence
        if: steps.swarm.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ secrets.SITON_AGENT_GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment "$PR_URL" --body-file /tmp/siton-swarm-synthesis.md

      # Telemetry only: execution records from builder runners are untrusted
      # and are used for nothing but the executed-model fields.
      - name: Download agent execution records
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: siton-*
          path: ${{ runner.temp }}/siton-telemetry

      - name: Record agent-run telemetry
        if: always()
        continue-on-error: true
        env:
          SITON_RUN_STARTED_EPOCH: ${{ needs.route.outputs.started_epoch }}
          SITON_TASK_TYPE: ${{ needs.route.outputs.type }}
          SITON_RISK: ${{ needs.route.outputs.risk }}
          SITON_MODEL_TIER: ${{ needs.route.outputs.tier }}
          SITON_CODEX_MODEL: ${{ needs.route.outputs.codex_model }}
          SITON_CLAUDE_MODEL: ${{ needs.route.outputs.builder == 'claude' && needs.route.outputs.claude_model || 'none' }}
          SITON_CLAUDE_REVIEWER_MODEL: ${{ needs.route.outputs.reviewer == 'claude' && needs.route.outputs.claude_reviewer_model || 'none' }}
          SITON_CLAUDE_BUILD_EXECUTION: ${{ runner.temp }}/siton-telemetry/siton-exec-build/claude-execution.json
          SITON_CLAUDE_FIX_EXECUTION: ${{ runner.temp }}/siton-telemetry/siton-exec-fix/claude-execution.json
          SITON_CLAUDE_REVIEW1_EXECUTION: ${{ runner.temp }}/siton-telemetry/siton-review-1/claude-execution.json
          SITON_CLAUDE_REVIEW2_EXECUTION: ${{ runner.temp }}/siton-telemetry/siton-review-2/claude-execution.json
          SITON_APEX_REASON: ${{ needs.route.outputs.apex_reason }}
          SITON_BUILDER: ${{ needs.route.outputs.builder }}
          SITON_REVIEWER: ${{ needs.route.outputs.reviewer }}
          SITON_FIX_PASSES: ${{ needs.review-1.outputs.needs_fix == 'true' && '1' || '0' }}
          SITON_VERIFICATION: ${{ job.status }}
          SITON_REVIEW_VERDICT: ${{ steps.final_review.outputs.verdict }}
          SITON_PR_URL: ${{ steps.pr.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          started="${SITON_RUN_STARTED_EPOCH:-}"
          [[ "$started" =~ ^[0-9]+$ ]] || started="$(date +%s)"
          export SITON_DURATION_SECONDS="$(( $(date +%s) - started ))"
          node "$RUNNER_TEMP/control/agent_router.cjs" metric agent-run-metric.json
          cat agent-run-metric.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload agent-run telemetry
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: agent-run-${{ github.run_id }}
          path: agent-run-metric.json
          if-no-files-found: warn
          retention-days: 90

      - name: Report result to source issue
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SITON_AGENT_GITHUB_TOKEN || github.token }}
          SITON_TASK: ${{ inputs.task }}
          PR_URL: ${{ steps.pr.outputs.url }}
          VERDICT: ${{ steps.final_review.outputs.verdict }}
          SWARM_VERDICT: ${{ steps.swarm.outputs.verdict }}
          BUILDER: ${{ needs.route.outputs.builder }}
          REVIEWER: ${{ needs.route.outputs.reviewer }}
          JOB_STATUS: ${{ job.status }}
          CREDENTIAL_STATE: ${{ needs.route.outputs.credential_state }}
        shell: bash
        run: |
          set -euo pipefail
          issue_number=$(printf '%s\n' "$SITON_TASK" | sed -nE 's/^\[source-issue:([0-9]+)\]$/\1/p' | head -n1)
          if [ -z "$issue_number" ]; then exit 0; fi
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf 'Cloud Agent Manager finished this run.\n\nStatus: %s\nBuilder: %s\nReviewer: %s\nFinal review: %s\nParallel analysis: %s\nPR: %s\nRun: %s\n\nNo auto-merge was performed.\n' "$JOB_STATUS" "${BUILDER:-unknown}" "${REVIEWER:-unknown}" "${VERDICT:-unknown}" "${SWARM_VERDICT:-not-required}" "${PR_URL:-none}" "$run_url" > /tmp/cloud-issue-result.md
          # Presence-only credential state from the route job; a blocked run
          # must still tell the owner what to do instead of leaving the issue
          # silent.
          if [ -n "$CREDENTIAL_STATE" ]; then
            printf '%s' "$CREDENTIAL_STATE" | base64 -d > /tmp/siton-credential-blocker.md || true
          fi
          if [ -s /tmp/siton-credential-blocker.md ]; then
            printf '\n' >> /tmp/cloud-issue-result.md
            cat /tmp/siton-credential-blocker.md >> /tmp/cloud-issue-result.md
          fi
          gh issue comment "$issue_number" --body-file /tmp/cloud-issue-result.md

name: Codex re-review latest PR head

on:
  pull_request_target:
    types:
      - synchronize

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: codex-rereview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  request-codex-rereview:
    name: Request Codex re-review
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Ask Codex to review the new head
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const sha = pr.head.sha;
            const marker = `<!-- siton:codex-rereview:${sha} -->`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const alreadyRequested = comments.some(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                (comment.body || "").includes(marker),
            );

            if (alreadyRequested) {
              core.info(`Codex re-review already requested for ${sha}`);
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: [
                "@codex review",
                "",
                `Automatic Siton re-review request for the latest PR head: \`${sha}\`.`,
                "A review attached only to an older head is stale after new commits.",
                "",
                marker,
              ].join("\n"),
            });

name: ChatGPT finalize adversarial review status

on:
  push:
    branches:
      - chatgpt/patch-transfer-c5b639e
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record-project-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/patch-transfer-c5b639e
          fetch-depth: 0

      - name: Update PROJECT_STATUS on target branch
        shell: bash
        env:
          TARGET_BRANCH: claude/senior-adversarial-production-review-cwupc5
          EXPECTED_HEAD: 56120ab8440a1d037dd8aa3c8143215b63879403
          STATUS_B64: 
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT Project Status'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf '%s' "$STATUS_B64" | base64 -d > /tmp/status.md
          cat /tmp/status.md PROJECT_STATUS.md > /tmp/PROJECT_STATUS.md
          mv /tmp/PROJECT_STATUS.md PROJECT_STATUS.md
          git add PROJECT_STATUS.md
          git diff --cached --check
          git commit -m 'docs(status): record GitHub patch transfer and PR #18'
          git push origin HEAD:"$TARGET_BRANCH"

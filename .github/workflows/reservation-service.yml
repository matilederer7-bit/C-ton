name: Reservation Service Concurrency Gate

on:
  pull_request:
    paths:
      - 'reservation-service/**'
      - '.github/workflows/reservation-service.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  concurrency-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: siton_reservation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d siton_reservation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/siton_reservation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install reservation service
        working-directory: reservation-service
        run: npm install
      - name: TypeScript build
        working-directory: reservation-service
        run: npm run build
      - name: PostgreSQL concurrency and close proof
        working-directory: reservation-service
        run: npm test

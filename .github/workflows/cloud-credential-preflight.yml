name: Siton Cloud Credential Preflight
run-name: Siton credential preflight ${{ github.run_id }}

# Lets the owner confirm from a phone that the cloud agent team can actually run,
# without opening a terminal and without ever exposing a secret value.
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Optional issue to receive the report comment"
        required: false
        default: ""
        type: string
  push:
    # Self-test: whenever the preflight itself changes, prove it still runs.
    paths:
      - .github/workflows/cloud-credential-preflight.yml
      - scripts/agent_credentials_preflight.cjs

permissions:
  contents: read
  issues: write

concurrency:
  group: siton-credential-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check cloud credentials without revealing any value
        id: check
        continue-on-error: true
        env:
          SITON_AGENT_GITHUB_TOKEN: ${{ secrets.SITON_AGENT_GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/agent_credentials_preflight.cjs credential-preflight.json credential-preflight.md

      - name: Publish report to the run summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f credential-preflight.md ]; then
            cat credential-preflight.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Credential preflight produced no report; see the failed step log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credential-preflight-${{ github.run_id }}
          path: |
            credential-preflight.json
            credential-preflight.md
          if-no-files-found: warn
          retention-days: 30

      - name: Report to the requested issue
        if: always() && inputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          case "$ISSUE_NUMBER" in
            ''|*[!0-9]*) echo "Ignoring non-numeric issue reference." ; exit 0 ;;
          esac
          if [ ! -f credential-preflight.md ]; then
            printf 'Credential preflight failed before producing a report. Run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > credential-preflight.md
          fi
          printf '\nRun: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> credential-preflight.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file credential-preflight.md

      - name: Fail the run when a credential blocks the agent team
        if: steps.check.outcome != 'success'
        run: |
          echo "Cloud credential preflight is BLOCKED; see the run summary for the exact owner action." >&2
          exit 1

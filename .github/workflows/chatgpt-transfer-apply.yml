name: ChatGPT transfer apply

on:
  push:
    branches:
      - chatgpt/transfer-bootstrap-f620072

permissions:
  contents: write

jobs:
  apply-transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap payload
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify transfer payload
        shell: bash
        run: |
          set -euo pipefail
          cat .transfer/part-* | base64 --decode | gzip --decompress > /tmp/combined.mbox
          echo "aa7c0c7f46395d2772f9c367d4fb249f0f48b4a486b7d195a3c55769b6cdea64  /tmp/combined.mbox" | sha256sum --check

      - name: Apply exact patches and verify Git trees
        shell: bash
        run: |
          set -euo pipefail
          BASE=f2121f60cc37d742e2bf32d0ca48fe2ec83a807d
          TREE1=0b4cec17cc40c31491d5df059e9ab6c349585a37
          TREE2=73c8f83821c3112fc74da9d9117317dbf57b497a
          TARGET=claude/blissful-planck-l94ke3-transfer

          git config user.name "ChatGPT Transfer"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B "$TARGET" "$BASE"
          git am /tmp/combined.mbox

          test "$(git rev-parse HEAD~1^{tree})" = "$TREE1"
          test "$(git rev-parse HEAD^{tree})" = "$TREE2"
          test "$(git rev-parse HEAD~2)" = "$BASE"

          echo "TRANSFER_TREE_1_OK=$TREE1"
          echo "TRANSFER_TREE_2_OK=$TREE2"
          git log --oneline --decorate -3

      - name: Push verified transfer branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/claude/blissful-planck-l94ke3-transfer --force-with-lease

name: PR38 fix product catalog canonical assertions

on:
  push:
    branches:
      - claude/shelf-heavy-closeout-20260917

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Align Product Catalog migration test with canonical 069-072 ordering
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Siton Integration Bot"
          git config user.email "siton-integration@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/product_catalog_validation.ts')
          s = p.read_text()
          s = s.replace(
              '  • migration 072 is registered after 069 (070 reserved for PR #24) and\n',
              '  • migration 072 is registered after 071 in the canonical 069 CMS, 070 distribution, 071 long-horizon, 072 catalog order and\n'
          )
          old = '''await runTest("migration_071_registered_after_069_without_renumbering", async () => {\n  const names = await readdir("src/migrations");\n  assert.ok(names.includes("072_product_catalog_and_fulfillment_estimates.sql"));\n  assert.equal(names.some((n) => /^06[2-4]_.*product/.test(n) || /^070_/.test(n)), false, "071 does not squat on 062-064 or on the 070 slot reserved for PR #24");\n  const ids = [...manifest.matchAll(/\\["(\\d{3}a?)", "/g)].map((m) => m[1]);\n  assert.equal(ids[ids.length - 1], "071", "071 is the last manifest position");\n  assert.equal(ids[ids.length - 2], "069", "071 appends directly after 069 (070 is left for the long-horizon renumbering)");\n  assert.match(schema, /"products", "product_images"/, "boot fail-closes until 071 is applied (same rule as content tables)");\n});'''
          new = '''await runTest("migration_072_registered_after_long_horizon", async () => {\n  const names = await readdir("src/migrations");\n  assert.ok(names.includes("069_site_content_drafts_media.sql"));\n  assert.ok(names.includes("070_seller_distribution_links.sql"));\n  assert.ok(names.includes("071_long_horizon_authorization_renewal.sql"));\n  assert.ok(names.includes("072_product_catalog_and_fulfillment_estimates.sql"));\n  assert.equal(names.some((n) => /^06[2-4]_.*product/.test(n)), false, "Product Catalog does not squat on 062-064");\n  const ids = [...manifest.matchAll(/\\["(\\d{3}a?)", "/g)].map((m) => m[1]);\n  assert.deepEqual(ids.slice(-4), ["069", "070", "071", "072"], "canonical tail is CMS, distribution, long-horizon, Product Catalog");\n  assert.match(schema, /"products", "product_images"/, "boot fail-closes until 072 is applied (same rule as content tables)");\n});'''
          if old not in s:
              raise SystemExit('expected stale test block not found')
          s = s.replace(old, new)
          s = s.replace('await runTest("migration_071_shape_and_constraints"', 'await runTest("migration_072_shape_and_constraints"')
          p.write_text(s)
          PY
          git diff --check
          git add tests/product_catalog_validation.ts
          git commit -m "test(integration): align Product Catalog assertions to migration 072"
          git push origin HEAD:claude/shelf-heavy-closeout-20260917

name: PR38 fix catalog migration references

on:
  push:
    branches:
      - claude/shelf-heavy-closeout-20260917

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Rewrite stale Product Catalog 071 references to 072
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Siton Integration Bot"
          git config user.email "siton-integration@users.noreply.github.com"
          files=(
            tests/product_catalog_api_validation.ts
            tests/product_catalog_validation.ts
            web/src/api.ts
            web/src/pages/sellerProducts.tsx
            web/src/pages/seller.tsx
            web/src/productLibrary.ts
            src/app.ts
            src/frontend_runtime.ts
          )
          perl -pi -e 's/Product catalog \(071\)/Product catalog (072)/g; s/Product Catalog \(071\)/Product Catalog (072)/g; s/migration 071/migration 072/g; s/071_product_catalog_and_fulfillment_estimates\.sql/072_product_catalog_and_fulfillment_estimates.sql/g' "${files[@]}"
          if git diff --quiet; then
            echo "NO_STALE_REFERENCES_TO_FIX"
            exit 0
          fi
          git diff --check
          git add "${files[@]}"
          git commit -m "fix(integration): renumber Product Catalog references to 072"
          git push origin HEAD:claude/shelf-heavy-closeout-20260917

name: PR38 reconcile current master

on:
  push:
    branches:
      - claude/shelf-heavy-closeout-20260917

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current master with guarded conflict resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Siton Integration Bot"
          git config user.email "siton-integration@users.noreply.github.com"
          git fetch origin master

          if git merge-base --is-ancestor origin/master HEAD; then
            echo "CURRENT_MASTER_ALREADY_PRESENT"
            exit 0
          fi

          set +e
          git merge --no-commit --no-ff origin/master
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            printf 'CONFLICTS=%s\n' "${conflicts[*]}"
            expected=("scripts/migration_manifest.cjs" "src/schema_contract.ts")
            if [ "${conflicts[*]}" != "${expected[*]}" ]; then
              echo "Unexpected conflict set; refusing automatic resolution"
              git merge --abort || true
              exit 1
            fi
            # Both files were deliberately pre-reconciled on this branch:
            # manifest = 069 CMS, 070 distribution, 071 long-horizon, 072 catalog;
            # schema contract = union of distribution + product required tables.
            git checkout --ours scripts/migration_manifest.cjs src/schema_contract.ts
            git add scripts/migration_manifest.cjs src/schema_contract.ts
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain"
            exit 1
          fi

          git commit -m "Merge current master into PR38 after long-horizon integration"
          git push origin HEAD:claude/shelf-heavy-closeout-20260917

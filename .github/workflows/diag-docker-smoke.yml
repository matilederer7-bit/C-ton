# TEMPORARY diagnostic for PR #8 — runs ONLY the extended Docker smoke on pushes to the
# closure branch so the failing step's exact error is surfaced as a public annotation in
# minutes instead of after the full 18-minute backend job. Not a gate. Delete before merge.
name: Diag docker smoke (temporary, PR 8)

on:
  push:
    branches: [claude/staging-acceptance-closure]

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean dependency install
        run: npm ci

      - name: Tooling versions
        run: |
          docker version || echo "::warning title=docker version::exit $?"
          docker compose version || echo "::warning title=docker compose version::exit $?"
          docker compose -p siton-ci-gate -f docker-compose.ci.yml config --quiet && echo "COMPOSE_CONFIG_OK" || echo "::error title=compose config::docker compose config failed with exit $?"

      - name: Extended Docker process, MinIO, multi-Web, worker, and outbox fault smoke
        run: mkdir -p .ci-artifacts && npm run ci:docker-smoke 2>&1 | tee .ci-artifacts/docker-smoke.log

      - name: Surface the smoke log tail as annotations
        if: failure()
        run: |
          echo "::group::docker-smoke.log tail"
          tail -n 80 .ci-artifacts/docker-smoke.log || true
          echo "::endgroup::"
          grep -vE '^\{"level"' .ci-artifacts/docker-smoke.log | grep -E 'Error|error|failed|denied|not found|Cannot|refused|exit' | tail -n 12 | while IFS= read -r line; do echo "::error title=docker-smoke log::${line:0:900}"; done
          echo "::group::docker-compose.log tail"
          tail -n 120 .ci-artifacts/docker-compose.log || true
          echo "::endgroup::"

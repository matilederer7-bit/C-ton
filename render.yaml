services:
  - type: web
    name: siton-demo-preview
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run start:web:prod
    preDeployCommand: npm run db:migrate
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: APP_DEPLOYMENT_MODE
        value: demo-preview
      - key: RUNTIME_ROLE
        value: web
      - key: DISABLE_OUTBOX_WORKER
        value: "1"
      - key: ADMIN_API_KEY
        generateValue: true
      - key: EXPECTED_COMMIT_SHA
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: DB_SCHEMA
        value: siton
      - key: STORAGE_ADAPTER
        sync: false
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_REGION
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_FORCE_PATH_STYLE
        value: "0"
      - key: OBJECT_STORAGE_PREFIX
        value: sandbox
      - key: OBJECT_STORAGE_TIMEOUT_MS
        value: "5000"
      - key: OBJECT_STORAGE_SIGNED_URL_TTL_SECONDS
        value: "300"
      - key: LOG_LEVEL
        value: info
      - key: DEBUG_SQL_LOGGING
        value: "0"
      - key: DEBUG_JOIN_LOGGING
        value: "0"
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: PAYMENT_PROVIDER
        sync: false
      - key: PAYMENT_PROVIDER_MODE
        sync: false
      - key: PAYMENT_WEBHOOK_PROVIDER
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      # Real Morning invoice activation must be set manually in Render.
      - key: INVOICE_PROVIDER
        sync: false
      - key: INVOICE_PROVIDER_MODE
        sync: false
      - key: INVOICE_PROVIDER_BASE_URL
        sync: false
      - key: INVOICE_PROVIDER_API_KEY
        sync: false
      - key: INVOICE_PROVIDER_BEARER_TOKEN
        sync: false
      - key: INVOICE_WEBHOOK_SECRET
        sync: false
      - key: NOTIFICATION_PROVIDER
        value: log-only
      - key: DATABASE_URL
        sync: false
  - type: worker
    name: siton-background-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run start:worker:prod
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_DEPLOYMENT_MODE
        value: demo-preview
      - key: RUNTIME_ROLE
        value: worker
      - key: DATABASE_URL
        sync: false
      - key: DB_SCHEMA
        value: siton
      - key: STORAGE_ADAPTER
        sync: false
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_REGION
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_FORCE_PATH_STYLE
        value: "0"
      - key: OBJECT_STORAGE_PREFIX
        value: sandbox
      - key: OBJECT_STORAGE_TIMEOUT_MS
        value: "5000"
      - key: OBJECT_STORAGE_SIGNED_URL_TTL_SECONDS
        value: "300"
      - key: LOG_LEVEL
        value: info
      - key: WORKER_CONCURRENCY
        value: "4"
      - key: WORKER_MONEY_CONCURRENCY
        value: "1"
      - key: WORKER_RECONCILE_CONCURRENCY
        value: "1"
      - key: WORKER_INVOICE_CONCURRENCY
        value: "2"
      - key: WORKER_LEASE_MS
        value: "60000"
      - key: WORKER_STUCK_TIMEOUT_MS
        value: "60000"
      - key: WORKER_HEARTBEAT_MS
        value: "10000"
      - key: WORKER_SHUTDOWN_TIMEOUT_MS
        value: "30000"
      - key: OUTBOX_MAX_ATTEMPTS
        value: "4"
      - key: PAYMENT_PROVIDER
        sync: false
      - key: PAYMENT_PROVIDER_MODE
        sync: false
      - key: PAYOUT_PROVIDER
        value: internal-ledger
      - key: PAYOUT_PROVIDER_MODE
        value: internal-truth-only
      - key: NOTIFICATION_PROVIDER
        value: log-only
      - key: INVOICE_PROVIDER_MODE
        value: internal-truth-only

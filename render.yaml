# Canonical Render staging blueprint — Fastify Web runtime + continuous Worker.
#
# Targets the canonical Postgres staging authority (Supabase siton-staging,
# eu-central-1). The Web service (R3) and the continuous Background Worker (R4)
# each authenticate with their own dedicated least-privilege LOGIN identity.
#
# No secret lives in this file. Each DATABASE_URL is provisioned only through
# the Render dashboard (sync: false): the Web service authenticates as
# siton_web_login (supabase/staging/010_r3_web_login_provisioning.sql) and the
# Worker as siton_worker_login (supabase/staging/011_r4_worker_login_provisioning.sql),
# both adopting their audited NOLOGIN runtime profile server-side through the
# Supavisor session-mode pooler. ADMIN_API_KEY and SELLER_SESSION_SECRET are
# generated by Render and never enter Git.
services:
  - type: web
    name: siton-staging-web
    runtime: docker
    region: frankfurt
    plan: free
    branch: master
    dockerfilePath: ./Dockerfile
    healthCheckPath: /readiness
    autoDeploy: true
    envVars:
      - key: APP_DEPLOYMENT_MODE
        value: staging
      - key: RUNTIME_ROLE
        value: web
      - key: CANONICAL_POSTGRES_RUNTIME
        value: "1"
      - key: DISABLE_OUTBOX_WORKER
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: SELLER_SESSION_SECRET
        generateValue: true
      # R7 — canonical Supabase Storage via the storage-broker Edge Function.
      # SITON_STORAGE_BROKER_KEY is the narrowly-scoped broker credential
      # (bucket-scoped storage ops only); its plaintext lives only in Render.
      - key: STORAGE_ADAPTER
        value: supabase
      - key: SUPABASE_URL
        value: https://hnptacfzuqebfgeshadq.supabase.co
      - key: SUPABASE_STORAGE_BUCKET
        value: deal-images
      - key: OBJECT_STORAGE_PREFIX
        value: staging
      - key: SITON_STORAGE_BROKER_KEY
        sync: false
      # Money, communications and providers stay synthetic/off in staging.
      # Grow activation is a separate explicitly authorized stage.
      - key: PAYMENT_PROVIDER
        value: mockpay
      - key: PAYMENT_PROVIDER_MODE
        value: mock-backed
      - key: PAYMENT_ENVIRONMENT
        value: demo
      - key: NOTIFICATION_PROVIDER
        value: log-only
      - key: PAYOUT_PROVIDER
        value: internal-ledger

  # R4 — the single approved continuous Background Worker (0.5 CPU / 512 MB,
  # "starter", ~US$7/month; the only paid staging resource). Same Docker image
  # as the Web service, started via npm run start:worker:prod. It authenticates
  # as siton_worker_login through the Supavisor session-mode pooler and never
  # reuses the Web credential. It runs the outbox worker (DISABLE_OUTBOX_WORKER
  # is deliberately absent) while the Web service has it disabled.
  - type: worker
    name: siton-staging-worker
    runtime: docker
    region: frankfurt
    plan: starter
    branch: master
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run start:worker:prod
    autoDeploy: true
    envVars:
      - key: APP_DEPLOYMENT_MODE
        value: staging
      - key: RUNTIME_ROLE
        value: worker
      - key: CANONICAL_POSTGRES_RUNTIME
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: SELLER_SESSION_SECRET
        generateValue: true
      # R7 — the Worker shares the canonical Supabase Storage broker identity
      # (asynchronous storage cleanup must reach the same durable bucket).
      - key: STORAGE_ADAPTER
        value: supabase
      - key: SUPABASE_URL
        value: https://hnptacfzuqebfgeshadq.supabase.co
      - key: SUPABASE_STORAGE_BUCKET
        value: deal-images
      - key: OBJECT_STORAGE_PREFIX
        value: staging
      - key: SITON_STORAGE_BROKER_KEY
        sync: false
      # Money, communications and providers stay synthetic/off in staging.
      # Grow activation is a separate explicitly authorized stage.
      - key: PAYMENT_PROVIDER
        value: mockpay
      - key: PAYMENT_PROVIDER_MODE
        value: mock-backed
      - key: PAYMENT_ENVIRONMENT
        value: demo
      - key: NOTIFICATION_PROVIDER
        value: log-only
      - key: PAYOUT_PROVIDER
        value: internal-ledger

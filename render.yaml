# R3 canonical Render staging blueprint — Fastify Web runtime only.
#
# Targets the canonical Postgres staging authority (Supabase siton-staging,
# eu-central-1). The continuous Worker is intentionally absent: it is a
# separate R4 stage with its own least-privilege LOGIN identity.
#
# No secret lives in this file. DATABASE_URL is provisioned only through the
# Render dashboard (sync: false) and must authenticate as siton_web_login,
# whose sessions adopt the audited siton_web_runtime profile server-side
# (supabase/staging/010_r3_web_login_provisioning.sql). ADMIN_API_KEY and
# SELLER_SESSION_SECRET are generated by Render and never enter Git.
services:
  - type: web
    name: siton-staging-web
    runtime: docker
    region: frankfurt
    plan: free
    branch: master
    dockerfilePath: ./Dockerfile
    healthCheckPath: /readiness
    autoDeploy: true
    envVars:
      - key: APP_DEPLOYMENT_MODE
        value: staging
      - key: RUNTIME_ROLE
        value: web
      - key: CANONICAL_POSTGRES_RUNTIME
        value: "1"
      - key: DISABLE_OUTBOX_WORKER
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: SELLER_SESSION_SECRET
        generateValue: true
      # Money, communications and providers stay synthetic/off in staging.
      # Grow activation is a separate explicitly authorized stage.
      - key: PAYMENT_PROVIDER
        value: mockpay
      - key: PAYMENT_PROVIDER_MODE
        value: mock-backed
      - key: PAYMENT_ENVIRONMENT
        value: demo
      - key: NOTIFICATION_PROVIDER
        value: log-only
      - key: PAYOUT_PROVIDER
        value: internal-ledger

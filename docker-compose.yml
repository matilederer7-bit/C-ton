services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: siton_demo
      POSTGRES_PASSWORD: siton_demo_password
      POSTGRES_DB: siton_demo
    ports:
      - "5433:5432"
    volumes:
      - siton_demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siton_demo -d siton_demo"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment: &demo-env
      APP_DEPLOYMENT_MODE: demo-preview
      NODE_ENV: production
      DATABASE_URL: postgresql://siton_demo:siton_demo_password@postgres:5432/siton_demo
      DB_SCHEMA: siton
      ADMIN_API_KEY: demo-admin-key-do-not-use-in-production
      PAYMENT_PROVIDER: mockpay
      PAYMENT_PROVIDER_MODE: mock-backed
      PAYMENT_WEBHOOK_PROVIDER: mockpay
      PAYMENT_WEBHOOK_SECRET: mock-webhook-secret
      PAYOUT_PROVIDER: internal-ledger
      PAYOUT_PROVIDER_MODE: internal-truth-only
      NOTIFICATION_PROVIDER: log-only
      DISABLE_OUTBOX_WORKER: "1"
    command: ["npm", "run", "db:migrate"]

  app:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *demo-env
      RUNTIME_ROLE: web
      HOST: 0.0.0.0
      PORT: "3000"
      UPLOAD_DIR: /tmp/uploads
    command: ["npm", "run", "start:web:prod"]
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *demo-env
      RUNTIME_ROLE: worker
      WORKER_CONCURRENCY: "4"
      WORKER_HEARTBEAT_MS: "10000"
    command: ["npm", "run", "start:worker:prod"]

volumes:
  siton_demo_pgdata:

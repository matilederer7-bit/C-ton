<!doctype html>
<html lang="he" dir="rtl" data-locale="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <title>C-ton — קניות קבוצתיות</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/preview/brand/favicon-64.png" />
    <link rel="apple-touch-icon" href="/preview/brand/c-ton-mark-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Rubik:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Language before the first paint.
         The document ships as Hebrew (the product default). If — and only if —
         the visitor has previously CHOSEN a language, this reflects that choice
         onto <html> before anything renders, so an English visitor never sees a
         frame of RTL layout while the bundle loads. The operating system and
         navigator.language are deliberately not consulted: Hebrew stays the
         default until the visitor says otherwise. -->
    <script>
      (function () {
        try {
          var stored = null;
          try { stored = window.localStorage.getItem("siton.locale"); } catch (e) {}
          if (stored !== "he" && stored !== "en") {
            var m = document.cookie.match(/(?:^|;\s*)siton_lang=(he|en)\b/);
            stored = m ? m[1] : null;
          }
          if (stored !== "he" && stored !== "en") return;
          var el = document.documentElement;
          el.setAttribute("lang", stored);
          el.setAttribute("dir", stored === "he" ? "rtl" : "ltr");
          el.setAttribute("data-locale", stored);
          if (stored === "en") document.title = "C-ton — group buying";
        } catch (e) {}
      })();
    </script>
    <style>
      /* pre-hydration paint: the C-ton paper ground, same as the app */
      html { background: #f8fafc; }
      body { margin: 0; background: #f8fafc; }
      /* LAUNCH POLISH (P8) — while the JS bundle is still downloading/parsing
         the shell already says WHAT is happening (no blank unexplained screen).
         React replaces this node on mount; no dependency, no script. */
      .boot-loader { min-height: 100dvh; display: grid; place-items: center; color: #334155; font: 500 15px/1.5 "Assistant", "Segoe UI", system-ui, sans-serif; text-align: center; }
      .boot-loader img { width: 64px; height: 64px; border-radius: 18px; box-shadow: 0 12px 26px -12px rgba(15, 23, 42, .45); display: block; margin: 0 auto 14px; }
      .boot-loader .boot-bar { width: 120px; height: 4px; border-radius: 2px; background: #e5e7eb; margin: 0 auto 12px; overflow: hidden; position: relative; }
      .boot-loader .boot-bar::after { content: ""; position: absolute; inset: 0; width: 45%; background: linear-gradient(90deg, #0f172a, #2dd4bf); border-radius: 2px; animation: boot-slide 1.1s ease-in-out infinite alternate; }
      @keyframes boot-slide { from { transform: translateX(-70%); } to { transform: translateX(170%); } }
      @media (prefers-reduced-motion: reduce) { .boot-loader .boot-bar::after { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" role="status" aria-live="polite" data-testid="boot-loader">
        <div>
          <img src="/preview/brand/c-ton-mark-180.png" alt="" aria-hidden="true" width="64" height="64" />
          <div class="boot-bar" aria-hidden="true"></div>
          <div id="boot-text">C-ton נטען…</div>
        </div>
      </div>
    </div>
    <!-- The boot line is the only copy in the shell; it follows the language
         the head script already resolved onto <html>. -->
    <script>
      (function () {
        if (document.documentElement.getAttribute("data-locale") !== "en") return;
        var boot = document.getElementById("boot-text");
        if (boot) boot.textContent = "Loading C-ton…";
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>

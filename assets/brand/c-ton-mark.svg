<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">C-ton</title>
  <desc id="description">Daylight C-ton mark: a white C on a Siton Indigo tile with the Siton Coral bar</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6353ff"/>
      <stop offset=".55" stop-color="#4a3aff"/>
      <stop offset="1" stop-color="#3322d6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
